<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<title>Rizzlers Pick'ems</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Rizzlers Pick'ems — a trading terminal, not a sports template: steel blue on
   graphite, monospaced figures, hairlines instead of boxes. One accent, spent
   sparingly; green and red mean results and nothing else. */
:root{
  /* graphite with a cool bias — a chosen neutral, not a default grey */
  --ink:#0a0c0f;
  --ink-2:#0d1015;
  --slate:#12161c;
  --slate-2:#171c24;
  --slate-3:#1d232c;

  --hair:rgba(255,255,255,.075);
  --hair-strong:rgba(255,255,255,.15);
  --lift:inset 0 1px 0 rgba(255,255,255,.05);

  --text:#e8edf3;
  --muted:#98a3b2;
  --dim:#68737f;

  /* steel blue: reads as data, and sits furthest in hue from win/loss */
  --accent:#5aa9f0;
  --accent-hi:#84c2f7;
  --accent-dim:rgba(90,169,240,.13);
  --accent-line:rgba(90,169,240,.45);

  --win:#3ed49a;
  --win-dim:rgba(62,212,154,.13);
  --loss:#f2606a;
  --loss-dim:rgba(242,96,106,.12);
  --push:#7c8794;

  --r:12px;
  --r-sm:8px;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px -12px rgba(0,0,0,.75);
  --ease:cubic-bezier(.2,.6,.35,1);

  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.5;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
  /* one soft brass bloom behind the header, the only ornament on the page */
  background-image:radial-gradient(120% 55% at 50% -14%,rgba(90,169,240,.075),transparent 62%);
  background-attachment:fixed;
}
h1,h2,h3,h4{margin:0;font-family:var(--sans);font-weight:600;letter-spacing:-.02em;
  text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;font-family:var(--sans)}
.num,.card .rec,.hm-tile .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1060px;margin:0 auto;padding:0 1.5rem 5rem}
::selection{background:var(--accent-dim);color:var(--accent-hi)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:100;background:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:1.5rem}
.gate-card{width:100%;max-width:340px;text-align:center}
.gate-card h1{font-size:2.15rem;line-height:1.05;letter-spacing:-.035em;font-weight:600}
.gate-card h1 span{color:var(--accent)}
.gate-sub{color:var(--dim);font-size:.82rem;margin:.55rem 0 1.9rem;letter-spacing:0}
.gate-row{display:flex;gap:.5rem}
input,select,textarea{font:inherit;background:var(--slate);color:var(--text);
  border:1px solid var(--hair);border-radius:var(--r-sm);padding:.62rem .8rem;width:100%;
  transition:border-color .15s var(--ease),background .15s var(--ease)}
input:hover,select:hover,textarea:hover{border-color:var(--hair-strong)}
input::placeholder{color:var(--dim)}
.err{color:var(--loss);font-size:.8rem;margin-top:.8rem;min-height:1.2em}

/* ---------- buttons ---------- */
.btn{background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:#06121f;
  border:0;border-radius:var(--r-sm);padding:.6rem 1.05rem;font-weight:600;font-size:.86rem;
  letter-spacing:-.005em;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,
  0 6px 16px -10px rgba(90,169,240,.6);transition:filter .15s var(--ease),transform .1s var(--ease)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--slate);color:var(--muted);border:1px solid var(--hair);
  box-shadow:var(--lift)}
.btn.ghost:hover{color:var(--text);border-color:var(--hair-strong);filter:none}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- chrome ---------- */
.top{position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--ink) 88%,transparent);
  backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--hair)}
.top-in{max-width:1060px;margin:0 auto;padding:.85rem 1.5rem;
  display:flex;align-items:center;gap:.85rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:600;font-size:.95rem;
  letter-spacing:-.02em}
.brand::before{content:"R";width:22px;height:22px;border-radius:6px;flex:none;
  background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:#06121f;
  display:grid;place-items:center;font-size:.78rem;font-weight:700;letter-spacing:0}
.brand span{color:var(--accent)}
.spacer{margin-left:auto}
.who{display:flex;align-items:center;gap:.45rem;font-size:.8rem;color:var(--dim)}
.who b{color:var(--text);font-weight:600}
.lnk{background:none;border:0;padding:0 0 0 .1rem;color:var(--accent);font-size:.78rem;
  text-decoration:underline;text-underline-offset:2px;transition:color .15s var(--ease)}
.lnk:hover{color:var(--accent-hi)}
.tabs{display:flex;max-width:1060px;margin:0 auto;padding:0 1.5rem;gap:1.6rem;
  border-bottom:1px solid var(--hair)}
.tab{background:none;border:0;padding:.72rem 0;font-weight:500;font-size:.86rem;
  color:var(--dim);border-bottom:1.5px solid transparent;margin-bottom:-1px;
  transition:color .15s var(--ease)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab:hover{color:var(--muted)}

.head{padding:1.9rem 0 1.15rem}
.head h2{font-size:1.35rem;letter-spacing:-.028em}
.head p{margin:.3rem 0 0;color:var(--dim);font-size:.84rem}

/* ---------- shared panel ---------- */
.panel{background:var(--slate);border:1px solid var(--hair);border-radius:var(--r);
  box-shadow:var(--shadow),var(--lift);overflow:hidden}

/* ---------- picks ---------- */
.games{display:flex;flex-direction:column;gap:.4rem}
.daymark{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin:1.5rem 0 .5rem;font-weight:600}
.game{background:var(--slate);border:1px solid var(--hair);border-radius:var(--r);
  box-shadow:var(--lift);padding:.8rem .9rem;display:grid;
  grid-template-columns:1fr auto;gap:.8rem;align-items:center}
.game.graded-w{box-shadow:var(--lift),inset 3px 0 0 var(--win)}
.game.graded-l{box-shadow:var(--lift),inset 3px 0 0 var(--loss)}
.game.graded-p{box-shadow:var(--lift),inset 3px 0 0 var(--push)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.side{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  background:var(--slate-2);border:1px solid transparent;border-radius:var(--r-sm);
  padding:.58rem .7rem;text-align:left;
  transition:background .15s var(--ease),border-color .15s var(--ease)}
.side:hover{background:var(--slate-3)}
.side .nm{font-weight:500;font-size:.88rem}
.side .sp{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.76rem;
  color:var(--muted)}
.side[aria-pressed="true"]{background:var(--accent-dim);border-color:var(--accent-line)}
.side[aria-pressed="true"] .nm{color:var(--accent-hi)}
.side[aria-pressed="true"] .sp{color:var(--accent)}
.side.is-ats{box-shadow:inset 0 0 0 1px var(--win)}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:.35rem;min-width:108px}
.note{font-size:.64rem;color:var(--accent);letter-spacing:.09em;text-transform:uppercase;
  font-weight:600}
.votes{display:flex;gap:.22rem}
.dot{width:19px;height:19px;border-radius:50%;font-size:.58rem;font-weight:700;
  display:grid;place-items:center;background:var(--slate-3);color:var(--dim);
  border:1px solid var(--hair)}
.dot.a{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
.dot.h{background:rgba(196,160,232,.14);border-color:rgba(196,160,232,.42);color:#c9a6ee}
.chip{font-size:.63rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;
  padding:.2rem .45rem;border-radius:5px;background:var(--slate-3);color:var(--muted);
  border:1px solid var(--hair)}
.chip.win{color:var(--win);border-color:rgba(62,212,154,.35);background:var(--win-dim)}
.chip.loss{color:var(--loss);border-color:rgba(242,96,106,.35);background:var(--loss-dim)}
.chip.push{color:var(--push);border-color:var(--hair)}
.final{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.76rem;
  color:var(--dim)}
.mx-pick{margin-top:.85rem}

/* ---------- home ---------- */
.hm-hero{display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap;padding:1.9rem 0 .2rem}
.hm-hero h2{font-size:1.7rem;letter-spacing:-.03em}
.hm-hero .sub{color:var(--dim);font-size:.84rem;margin-top:.35rem}
.hm-jump{display:flex;gap:.45rem;margin-left:auto;flex-wrap:wrap}
.hm-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:.55rem;margin:1.2rem 0 .2rem}
.hm-tile{background:var(--slate);border:1px solid var(--hair);border-radius:var(--r);
  box-shadow:var(--lift);padding:.85rem 1rem}
.hm-tile.lead{border-color:var(--accent-line);background:
  linear-gradient(180deg,var(--accent-dim),transparent 70%),var(--slate)}
.hm-tile h4{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:600}
.hm-tile.lead h4{color:var(--accent)}
.hm-tile .v{font-size:1.5rem;font-weight:500;margin-top:.35rem;letter-spacing:-.03em}
.hm-tile .s{font-size:.72rem;color:var(--dim);margin-top:.15rem}
.hm-legend{font-size:.72rem;color:var(--dim);margin:1.6rem 0 .1rem}
.hm-legend b{color:var(--muted);font-weight:600}

/* games as hairline rows inside one panel per day, not a box each */
.hm-day{margin-top:.5rem}
.hm-list{background:var(--slate);border:1px solid var(--hair);border-radius:var(--r);
  box-shadow:var(--shadow),var(--lift);overflow:hidden}
.hm-g{display:grid;grid-template-columns:1fr 1fr 34px;align-items:stretch;
  border-top:1px solid var(--hair)}
.hm-g:first-child{border-top:0}
.sd{display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;min-width:0;
  border-left:2px solid transparent}
.sd+.sd{box-shadow:inset 1px 0 0 var(--hair)}
.sd .nm{font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--muted)}
.sd .sp{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.74rem;
  color:var(--dim);margin-left:auto;flex:none}
.sd .ini{display:flex;gap:.16rem;flex:none}
.sd.grp{border-left-color:var(--accent)}
.sd.grp .nm{color:var(--text);font-weight:600}
.sd.cov{background:var(--win-dim)}
.sd.cov .nm{color:var(--win)}
.sd.psh{background:rgba(124,135,148,.08)}
.ini span{width:16px;height:16px;border-radius:50%;font-size:.55rem;font-weight:700;
  display:grid;place-items:center;background:transparent;color:transparent;
  border:1px solid var(--hair)}
.ini span.on{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
.hm-res{display:grid;place-items:center;font-size:.76rem;font-weight:600;
  color:var(--dim);box-shadow:inset 1px 0 0 var(--hair);font-family:var(--mono)}
.hm-res.w{color:var(--win)}
.hm-res.l{color:var(--loss)}
.hm-res.p{color:var(--push)}

/* ---------- share box ---------- */
.hm-share{margin-top:1.25rem;background:var(--slate);border:1px solid var(--hair);
  border-radius:var(--r);box-shadow:var(--shadow),var(--lift);padding:1rem 1.1rem 1.15rem}
.hm-share h3{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:600}
.hm-share .row{margin-top:.7rem}
.hm-share textarea{min-height:118px;resize:vertical;font-family:var(--mono);
  font-size:.8rem;line-height:1.65;background:var(--ink-2);border-color:var(--hair)}
.hm-share .hint{color:var(--dim);font-size:.76rem;margin:.55rem 0 0}
.hm-share .pending{color:var(--accent-hi);font-size:.78rem;margin:.55rem 0 0}

/* ---------- week strip ---------- */
.weeks{display:flex;flex-wrap:wrap;gap:.4rem;padding:1.15rem 0 .1rem}
.wk{font-size:.78rem;font-weight:500;padding:.44rem .8rem;border-radius:var(--r-sm);
  background:var(--slate);color:var(--muted);border:1px solid var(--hair);
  box-shadow:var(--lift);display:flex;flex-direction:column;align-items:center;
  line-height:1.2;min-width:76px;transition:border-color .15s var(--ease),color .15s var(--ease)}
.wk:hover{border-color:var(--hair-strong);color:var(--text)}
.wk[aria-pressed="true"]{background:linear-gradient(180deg,var(--accent-dim),transparent),
  var(--slate);border-color:var(--accent-line);color:var(--accent-hi)}
.wk small{font-size:.62rem;font-weight:400;color:var(--dim);margin-top:.15rem;
  font-family:var(--mono);font-variant-numeric:tabular-nums}
.wk[aria-pressed="true"] small{color:var(--accent)}
.wk.done small{color:var(--win)}

/* ---------- score grading ---------- */
.cover{display:grid;grid-template-columns:1fr 1fr auto;gap:.45rem;align-items:stretch}
.cv{display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  background:var(--slate-2);border:1px solid transparent;border-radius:var(--r-sm);
  padding:.6rem .75rem;text-align:left;
  transition:background .15s var(--ease),border-color .15s var(--ease)}
.cv:hover{background:var(--slate-3)}
.cv .nm{font-weight:500;font-size:.88rem}
.cv .sp{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.76rem;
  color:var(--muted)}
.cv[aria-pressed="true"]{background:var(--win-dim);border-color:rgba(62,212,154,.45)}
.cv[aria-pressed="true"] .nm{color:var(--win);font-weight:600}
.cv.push{min-width:62px;justify-content:center;font-size:.68rem;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);font-weight:600}
.cv.push[aria-pressed="true"]{background:rgba(124,135,148,.16);border-color:var(--push);
  color:var(--push)}
.gline{display:flex;align-items:baseline;gap:.6rem;margin:1.1rem 0 .35rem}
.gline .t{font-weight:500;font-size:.85rem;color:var(--text)}
.gline .r{margin-left:auto;font-size:.74rem;color:var(--dim);font-family:var(--mono)}

/* ---------- standings ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.6rem}
.card{background:var(--slate);border:1px solid var(--hair);border-radius:var(--r);
  box-shadow:var(--lift);padding:1rem 1.1rem}
.card.lead{border-color:var(--accent-line);background:
  linear-gradient(180deg,var(--accent-dim),transparent 70%),var(--slate)}
.card h3{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  font-weight:600}
.card.lead h3{color:var(--accent)}
.card .rec{font-size:1.75rem;font-weight:500;margin-top:.35rem;letter-spacing:-.035em}
.card .pct{font-size:.75rem;color:var(--dim);margin-top:.15rem}
.tablewrap{overflow-x:auto;border:1px solid var(--hair);border-radius:var(--r);
  margin-top:1.25rem;box-shadow:var(--lift);background:var(--slate)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.85rem}
th,td{padding:.6rem .8rem;text-align:left;border-bottom:1px solid var(--hair)}
th{font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
  background:var(--slate-2);font-weight:600}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--slate-2)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- lines editor ---------- */
.drop{border:1px dashed var(--hair-strong);border-radius:var(--r);padding:1.9rem 1rem;
  text-align:center;background:var(--slate);transition:border-color .15s var(--ease),
  background .15s var(--ease)}
.drop.over{border-color:var(--accent);background:var(--accent-dim)}
.drop p{margin:.5rem 0 0;color:var(--dim);font-size:.83rem}
.edit{display:grid;grid-template-columns:84px 1fr 1fr 70px 150px 34px;gap:.4rem;
  align-items:center;padding:.35rem 0}
.edit input,.edit select{padding:.42rem .55rem;font-size:.84rem}
.edit .x{background:none;border:1px solid var(--hair);border-radius:6px;color:var(--dim);
  padding:.36rem;line-height:1;transition:color .15s var(--ease),border-color .15s var(--ease)}
.edit .x:hover{color:var(--loss);border-color:var(--loss)}
.edithead{display:grid;grid-template-columns:84px 1fr 1fr 70px 150px 34px;gap:.4rem;
  font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  padding-bottom:.4rem;border-bottom:1px solid var(--hair);margin-top:1.25rem;font-weight:600}
.warn{background:linear-gradient(180deg,var(--accent-dim),transparent),var(--slate);
  border:1px solid var(--accent-line);border-radius:var(--r);padding:.8rem 1rem;
  font-size:.82rem;color:var(--accent-hi);margin:1rem 0}
.warn ul{margin:.45rem 0 0;padding-left:1.15rem}
.warn b{color:var(--text)}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:1.1rem}
.muted{color:var(--dim);font-size:.83rem}
.empty{text-align:center;padding:4rem 1rem;color:var(--dim)}
.empty h3{font-size:1.05rem;color:var(--muted);margin-bottom:.4rem;font-weight:500}
.status{font-size:.76rem;color:var(--dim);min-height:1.2em;margin-top:.75rem}

@media (max-width:640px){
  .wrap{padding:0 1rem 4rem}
  .top-in,.tabs{padding-left:1rem;padding-right:1rem}
  .tabs{gap:1.1rem;overflow-x:auto}
  .edit,.edithead{grid-template-columns:1fr 1fr;gap:.35rem}
  .edithead{display:none}
  .game{grid-template-columns:1fr}
  .meta{align-items:flex-start;flex-direction:row;flex-wrap:wrap}
  .hm-jump{margin-left:0;width:100%}
  .hm-g{grid-template-columns:1fr 1fr 28px}
  .sd{padding:.55rem .6rem}
  .sd .sp{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1>Rizzlers <span>Pick&#39;ems</span></h1>
    <p class="gate-sub">Pick'em against the spread. Enter your name to get in.</p>
    <div class="gate-row">
      <input id="pw" type="text" placeholder="Your name" autocomplete="username"
             autocapitalize="words" spellcheck="false" aria-label="Your name">
      <button class="btn" id="go">Enter</button>
    </div>
    <p class="err" id="gerr"></p>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand">Rizzlers <span>Pick&#39;ems</span></div>
      <div class="spacer"></div>
      <div class="who">Signed in as <b id="meName"></b>
        <button class="lnk" id="switchUser" type="button">Switch</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-pane="home" aria-selected="true">Home</button>
      <button class="tab" role="tab" data-pane="picks" aria-selected="false">Picks</button>
      <button class="tab" role="tab" data-pane="scores" aria-selected="false">Scores</button>
      <button class="tab" role="tab" data-pane="standings" aria-selected="false">Standings</button>
      <button class="tab" role="tab" data-pane="lines" aria-selected="false">Lines</button>
    </nav>
  </header>

  <main class="wrap">
    <section id="pane-home"></section>
    <section id="pane-picks" hidden></section>
    <section id="pane-scores" hidden></section>
    <section id="pane-standings" hidden></section>
    <section id="pane-lines" hidden></section>
  </main>
</div>

</script>
<script>
/* __PARSER__ */
</script>
<script>
(function () {
  "use strict";
  var P = window.PickemParser;
  var PEOPLE = ["Peter", "Dalton", "Hunter"];
  var COMMISSIONER = "Brian";
  // Your name is the password: one field that both lets you in and says who you
  // are, so picks can never be filed under the wrong person by mistake.
  var ALIASES = { daulton: "Dalton", pete: "Peter", hunt: "Hunter" };
  var SEASON = 2026;

  var db = null;                 // shared store, once it resolves
  var state = {
    me: "",
    week: null,
    weeks: {},                   // week -> {games, byes}
    picks: {},                   // week -> {person -> {gameId: side}}
    scores: {},                  // week -> {gameId: {awayScore, homeScore}}
    results: {},                 // week -> {gameId: "away"|"home"|"push"}
    draft: null,                 // parsed-but-unsaved lines
    tab: "home",
    confirmDelete: null,
    status: ""
  };

  /* ------------------------------------------------ gate */
  var gate = document.getElementById("gate");

  function whoIs(input) {
    var v = (input || "").trim().toLowerCase();
    if (!v) return null;
    if (ALIASES[v]) return ALIASES[v];
    for (var i = 0; i < PEOPLE.length; i++) {
      if (PEOPLE[i].toLowerCase() === v) return PEOPLE[i];
    }
    return null;
  }

  function unlock(who) {
    state.me = who;
    sessionStorage.setItem("c3.who", who);
    localStorage.setItem("c3.me", who);
    if (gate && gate.parentNode) gate.remove();
    document.getElementById("app").hidden = false;
    start();
    selectTab("picks");   // straight to your picks, which is why you're here
  }

  function tryPw() {
    var who = whoIs(document.getElementById("pw").value);
    if (who) unlock(who);
    else document.getElementById("gerr").textContent =
      "That's not one of us. Try Peter, Dalton or Hunter.";
  }

  if (gate) {
    document.getElementById("go").addEventListener("click", tryPw);
    document.getElementById("pw").addEventListener("keydown", function (e) {
      if (e.key === "Enter") tryPw();
    });
    document.getElementById("pw").addEventListener("input", function () {
      document.getElementById("gerr").textContent = "";
    });
  }
  var resumed = whoIs(sessionStorage.getItem("c3.who"));
  if (resumed) unlock(resumed);

  /* ------------------------------------------------ storage */
  // Every write is scoped to one document so three people writing at once
  // can't clobber each other: picks are per-person-per-week.
  function pickDocId(week, person) { return week + "-" + person; }

  async function start() {
    buildChrome();
    render();
    // Firebase's compat SDK exposes doc()/collection()/set()/onSnapshot() with the
    // same shape this app was already written against, so it drops straight in.
    try {
      if (window.firebase && window.FIREBASE_CONFIG) {
        firebase.initializeApp(window.FIREBASE_CONFIG);
        db = firebase.firestore();
      } else {
        db = null;
      }
    } catch (e) { db = null; }
    if (!db) {
      state.status = "Can't reach the database \u2014 picks won't be saved. Reload to retry.";
      render();
      return;
    }
    // Rebuild rather than merge: a merge would never notice a week someone else
    // deleted, so it would linger on their screen until a reload.
    db.collection("weeks").onSnapshot(function (snap) {
      state.weeks = {};
      snap.docs.forEach(function (d) {
        var v = d.data(); if (v) state.weeks[v.week] = v;
      });
      if (state.week == null || !state.weeks[state.week]) state.week = latestWeek();
      buildChrome(); render();
    }, function () {});
    db.collection("picks").onSnapshot(function (snap) {
      state.picks = {};
      snap.docs.forEach(function (d) {
        var v = d.data(); if (!v) return;
        (state.picks[v.week] = state.picks[v.week] || {})[v.person] = v.picks || {};
      });
      render();
    }, function () {});
    db.collection("scores").onSnapshot(function (snap) {
      state.scores = {}; state.results = {};
      snap.docs.forEach(function (d) {
        var v = d.data();
        if (!v) return;
        state.scores[v.week] = v.finals || {};
        state.results[v.week] = v.results || {};
      });
      render();
    }, function () {});
  }

  // The week most recently uploaded, not the highest number — uploading week 3
  // after week 9 should still land you on week 3.
  function latestWeek() {
    var ks = Object.keys(state.weeks).map(Number);
    if (!ks.length) return null;
    ks.sort(function (a, b) {
      var sa = (state.weeks[a] || {}).savedAt || "";
      var sb = (state.weeks[b] || {}).savedAt || "";
      if (sa && sb && sa !== sb) return sa < sb ? -1 : 1;
      return a - b;
    });
    return ks[ks.length - 1];
  }

  async function saveWeek(week, games, byes) {
    if (!db) return note("Can't save \u2014 no connection.");
    await db.doc("weeks/" + week).set({
      week: week, season: SEASON, games: games, byes: byes || [],
      savedAt: new Date().toISOString()
    });
    note("Week " + week + " lines saved.");
  }

  // Writes to one document are serialized and always send the COMPLETE local
  // map. Read-then-branch racing itself was a real bug: clicking four picks
  // quickly fired four saves that each found "doesn't exist" and full-replaced
  // the document, so only the last pick survived.
  var chains = {};
  function enqueue(key, fn) {
    chains[key] = (chains[key] || Promise.resolve()).then(fn, fn);
    return chains[key];
  }

  // Removing a week means the lines, all three people's picks, and the scores \u2014
  // otherwise a re-upload inherits picks from games that no longer exist.
  function weekDocPaths(week) {
    var paths = ["weeks/" + week, "scores/" + week];
    PEOPLE.forEach(function (p) { paths.push("picks/" + pickDocId(week, p)); });
    return paths;
  }

  async function deleteWeek(week) {
    if (!db) { note("Can't delete \u2014 no connection."); return; }
    try {
      await Promise.all(weekDocPaths(week).map(function (p) {
        return db.doc(p).delete();
      }));
    } catch (e) {
      note("Couldn't delete week " + week + " \u2014 check your connection.");
      return;
    }
    delete state.weeks[week];
    delete state.picks[week];
    delete state.scores[week];
    delete state.results[week];
    if (state.week === week) state.week = latestWeek();
    state.confirmDelete = null;
    buildChrome();
    note("Week " + week + " deleted \u2014 lines, picks and scores.");
  }

  function savePick(week, person, gameId, side) {
    if (!db) { note("Can't save \u2014 no connection."); return Promise.resolve(); }
    return enqueue("picks/" + pickDocId(week, person), function () {
      var all = (state.picks[week] || {})[person] || {};
      var clean = {};
      Object.keys(all).forEach(function (k) { if (all[k]) clean[k] = all[k]; });
      return db.doc("picks/" + pickDocId(week, person))
        .set({ week: week, person: person, picks: clean })
        .catch(function () { note("Couldn't save that pick \u2014 check your connection."); });
    });
  }

  function saveScore(week) {
    if (!db) { note("Can't save \u2014 no connection."); return Promise.resolve(); }
    return enqueue("scores/" + week, function () {
      var finals = state.scores[week] || {};
      var clean = {};
      Object.keys(finals).forEach(function (k) {
        var s = finals[k];
        if (s && (s.awayScore !== "" || s.homeScore !== "")) clean[k] = s;
      });
      var res = state.results[week] || {};
      var rclean = {};
      Object.keys(res).forEach(function (k) { if (res[k]) rclean[k] = res[k]; });
      // `finals` is still written (possibly empty) because the security rules
      // require it; exact scores are now optional, the result is what grades.
      return db.doc("scores/" + week).set({ week: week, finals: clean, results: rclean })
        .catch(function () { note("Couldn't save that \u2014 check your connection."); });
    });
  }

  function note(msg) { state.status = msg; render(); }

  /* ------------------------------------------------ chrome */
  function buildChrome() {
    document.getElementById("meName").textContent = state.me || "";
  }

  document.getElementById("switchUser").addEventListener("click", function () {
    sessionStorage.removeItem("c3.who");
    location.reload();
  });
  var PANES = ["home", "picks", "scores", "standings", "lines"];

  function selectTab(name) {
    state.tab = name;
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (x) {
      x.setAttribute("aria-selected", String(x.dataset.pane === name));
    });
    PANES.forEach(function (p) {
      document.getElementById("pane-" + p).hidden = (p !== name);
    });
    window.scrollTo({ top: 0, behavior: "auto" });
    render();
  }

  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function (t) {
    t.addEventListener("click", function () { selectTab(t.dataset.pane); });
  });

  /* ------------------------------------------------ helpers */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function gamesFor(w) { return (state.weeks[w] || {}).games || []; }
  function picksFor(w) { return state.picks[w] || {}; }
  function scoresFor(w) { return state.scores[w] || {}; }
  function pickOf(w, person, gid) { return ((picksFor(w)[person] || {})[gid]) || null; }
  function votesFor(w, gid) {
    var o = {};
    PEOPLE.forEach(function (p) { var v = pickOf(w, p, gid); if (v) o[p] = v; });
    return o;
  }
  function resultsFor(w) { return state.results[w] || {}; }
  // A clicked result is the source of truth; exact scores are a fallback so
  // weeks graded the old way (by typing finals) keep working.
  function resultOf(w, g) {
    return resultsFor(w)[g.id] || P.atsWinner(g, scoresFor(w)[g.id]);
  }
  function spreadLabel(g, side) {
    if (g.spread == null || !g.favored) return "";
    if (g.favored !== side) return "+" + fmt(g.spread);
    return "\u2212" + fmt(g.spread);
  }
  function fmt(n) { return (Math.round(Number(n) * 10) / 10).toString(); }
  function recStr(r) { return r.w + "-" + r.l + (r.p ? "-" + r.p : ""); }
  function pctStr(r) {
    var d = r.w + r.l;
    return d ? (Math.round((r.w / d) * 1000) / 10).toFixed(1) + "%" : "\u2014";
  }

  /* ------------------------------------------------ render */
  function render() {
    if (document.getElementById("app").hidden) return;
    renderHome();
    renderPicks();
    renderScores();
    renderStandings();
    renderLines();
  }

  function renderHome() {
    var el = document.getElementById("pane-home");
    if (!Object.keys(state.weeks).length) {
      el.innerHTML = empty("Nothing here yet",
        "Upload a weekly spreads PDF on the Lines tab and it'll show up here.");
      return;
    }
    var w = state.week, gs = gamesFor(w);
    var h = weekStrip("home");

    var graded = gs.filter(function (g) { return resultOf(w, g); }).length;
    var allIn = gs.filter(function (g) {
      return P.majority(votesFor(w, g.id), PEOPLE);
    }).length;

    h += '<div class="hm-hero"><div><h2>Week ' + w + "</h2>" +
      '<div class="sub">' + gs.length + " games &middot; " + allIn +
      " with all three picks in &middot; " + graded + " graded</div></div>" +
      '<div class="hm-jump">' +
        '<button class="btn ghost" data-go="picks">Make picks</button>' +
        '<button class="btn ghost" data-go="scores">Enter results</button>' +
        '<button class="btn ghost" data-go="standings">Standings</button>' +
      "</div></div>";

    // --- the message for the commissioner ---
    var undecided = [];
    var lines = gs.map(function (g) {
      var m = P.majority(votesFor(w, g.id), PEOPLE);
      if (!m) { undecided.push(g); return "TBD (" + g.away + " at " + g.home + ")"; }
      return m === "away" ? g.away : g.home;
    });
    var msg = "Hi " + COMMISSIONER + ", here are our picks for week " + w + ".\n\n"
            + lines.join("\n");

    h += '<div class="hm-share"><h3>Send to ' + esc(COMMISSIONER) + "</h3>" +
      (undecided.length
        ? '<p class="pending">' + undecided.length + " game" +
          (undecided.length > 1 ? "s" : "") + " still waiting on all three picks \u2014 " +
          "those show as TBD in the message.</p>"
        : "") +
      '<div class="row"><textarea id="shareBox" readonly>' + esc(msg) + "</textarea></div>" +
      '<div class="row"><button class="btn" id="copyMsg">Copy message</button></div>' +
      '<p class="hint">Copy this and send it on. It lists the group\u2019s majority ' +
      "pick for each game.</p></div>";

    // this week's records, once anything is graded
    if (graded) {
      var grp = P.tally(gs, function (g) { return P.majority(votesFor(w, g.id), PEOPLE); },
        function (g) { return resultOf(w, g); });
      h += '<div class="hm-tiles"><div class="hm-tile lead"><h4>The Group</h4>' +
        '<div class="v">' + recStr(grp) + '</div><div class="s">majority pick</div></div>';
      PEOPLE.forEach(function (p) {
        var r = P.tally(gs, function (g) { return pickOf(w, p, g.id); },
          function (g) { return resultOf(w, g); });
        h += '<div class="hm-tile"><h4>' + esc(p) + '</h4><div class="v">' + recStr(r) +
          '</div><div class="s">' + pctStr(r) + " this week</div></div>";
      });
      h += "</div>";
    }

    h += '<div class="hm-legend">Initials show who took each side \u2014 ' +
      PEOPLE.map(function (p) { return "<b>" + esc(p[0]) + "</b> " + esc(p); }).join(", ") +
      ". Blue edge marks the group's pick; green is the side that covered.</div>";

    var day = null;
    gs.forEach(function (g) {
      if (g.day && g.day !== day) {
        if (day !== null) h += "</div>";
        day = g.day;
        h += '<div class="daymark">' + esc(day) + '</div><div class="hm-list">';
      } else if (day === null && !g.day) {
        day = ""; h += '<div class="hm-list">';
      }
      var votes = votesFor(w, g.id);
      var maj = P.majority(votes, PEOPLE);
      var res = resultOf(w, g);

      function side(which, name) {
        var cls = "sd";
        if (maj === which) cls += " grp";
        if (res === which) cls += " cov";
        else if (res === "push") cls += " psh";
        // only render initials for people who actually took this side; empty
        // placeholder rings on both sides read as clutter at six per row
        var ini = PEOPLE.filter(function (p) { return votes[p] === which; })
          .map(function (p) {
            return '<span class="on" title="' + esc(p) + ": " + esc(name) + '">' +
              esc(p[0]) + "</span>";
          }).join("");
        return '<div class="' + cls + '"><span class="nm">' + esc(name) + "</span>" +
          '<span class="ini">' + ini + "</span>" +
          '<span class="sp">' + spreadLabel(g, which) + "</span></div>";
      }

      var mark = '<div class="hm-res">' +
        (!maj ? Object.keys(votes).length + "/3" : "") + "</div>";
      if (res === "push") mark = '<div class="hm-res p">=</div>';
      else if (res && maj) {
        mark = '<div class="hm-res ' + (res === maj ? "w" : "l") + '">' +
          (res === maj ? "&#10003;" : "&#10007;") + "</div>";
      }

      h += '<div class="hm-g">' + side("away", g.away) + side("home", g.home) + mark + "</div>";
    });
    if (day !== null) h += "</div>";
    h += statusLine();
    el.innerHTML = h;
    wireWeekStrip(el);
    Array.prototype.forEach.call(el.querySelectorAll("[data-go]"), function (b) {
      b.addEventListener("click", function () { selectTab(b.dataset.go); });
    });

    var copyBtn = document.getElementById("copyMsg");
    if (copyBtn) copyBtn.addEventListener("click", function () {
      var box = document.getElementById("shareBox");
      box.focus(); box.select();
      function done() { copyBtn.textContent = "Copied"; 
        setTimeout(function () { copyBtn.textContent = "Copy message"; }, 1800); }
      // execCommand is the fallback: the async clipboard API is blocked in some
      // browsers and can hang rather than reject.
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(msg).then(done, function () {
          try { document.execCommand("copy"); done(); }
          catch (e) { copyBtn.textContent = "Press \u2318C"; }
        });
      } else {
        try { document.execCommand("copy"); done(); }
        catch (e) { copyBtn.textContent = "Press \u2318C"; }
      }
    });
  }

  function renderPicks() {
    var el = document.getElementById("pane-picks");
    var w = state.week, gs = gamesFor(w);
    var strip = weekStrip("picks");
    if (!Object.keys(state.weeks).length) {
      el.innerHTML = empty("No lines yet",
        "Upload this week's spreads PDF on the Lines tab to get started.");
      return;
    }
    if (!state.me) {
      el.innerHTML = strip + empty("Who are you?",
        "Sign in with your name to make picks.");
      wireWeekStrip(el);
      return;
    }
    if (!gs.length) {
      el.innerHTML = strip + empty("Pick a week", "Choose a week above to make your picks.");
      wireWeekStrip(el);
      return;
    }
    var byes = (state.weeks[w] || {}).byes || [];
    var made = gs.filter(function (g) { return pickOf(w, state.me, g.id); }).length;
    var h = strip + '<div class="head"><div><h2>Week ' + w + " Picks</h2>" +
      '<p>' + made + " of " + gs.length + " in for " + esc(state.me) +
      (byes.length ? " &middot; bye: " + esc(byes.join(", ")) : "") + "</p></div></div>";

    var day = null;
    h += '<div class="games">';
    gs.forEach(function (g) {
      if (g.day && g.day !== day) { day = g.day; h += '<div class="daymark">' + esc(day) + "</div>"; }
      h += gameRow(w, g);
    });
    h += "</div>" + statusLine();
    el.innerHTML = h;
    wireWeekStrip(el);

    Array.prototype.forEach.call(el.querySelectorAll(".side"), function (b) {
      b.addEventListener("click", function () {
        var gid = b.dataset.gid, side = b.dataset.side;
        if (!state.me) return;
        var cur = pickOf(w, state.me, gid);
        var next = cur === side ? null : side;
        (state.picks[w] = state.picks[w] || {});
        (state.picks[w][state.me] = state.picks[w][state.me] || {})[gid] = next;
        render();
        savePick(w, state.me, gid, next);
      });
    });
  }

  function gameRow(w, g) {
    var votes = votesFor(w, g.id);
    var maj = P.majority(votes, PEOPLE);
    var res = resultOf(w, g);
    var sc = scoresFor(w)[g.id];
    var mine = pickOf(w, state.me, g.id);

    var cls = "";
    if (res && maj) cls = res === "push" ? " graded-p" : (res === maj ? " graded-w" : " graded-l");

    function side(which, name) {
      var pressed = mine === which;
      var isAts = res && res !== "push" && res === which;
      return '<button class="side' + (isAts ? " is-ats" : "") + '" data-gid="' +
        esc(g.id) + '" data-side="' + which + '" aria-pressed="' + pressed + '">' +
        '<span class="nm">' + esc(name) + "</span>" +
        '<span class="sp">' + spreadLabel(g, which) + "</span></button>";
    }

    var dots = PEOPLE.map(function (p) {
      var v = votes[p];
      return '<span class="dot' + (v === "away" ? " a" : v === "home" ? " h" : "") +
        '" title="' + esc(p) + (v ? ": " + (v === "away" ? g.away : g.home) : ": no pick") + '">' +
        esc(p[0]) + "</span>";
    }).join("");

    var chips = "";
    if (maj) {
      var mn = maj === "away" ? g.away : g.home;
      if (res === "push") chips += '<span class="chip push">Push</span>';
      else if (res) chips += '<span class="chip ' + (res === maj ? "win" : "loss") + '">' +
        (res === maj ? "Group \u2713" : "Group \u2717") + "</span>";
      else chips += '<span class="chip">Group: ' + esc(mn) + "</span>";
    } else {
      chips += '<span class="chip">' + Object.keys(votes).length + "/3 in</span>";
    }

    return '<article class="game' + cls + '">' +
      '<div class="sides">' + side("away", g.away) + side("home", g.home) + "</div>" +
      '<div class="meta">' +
        (g.note ? '<span class="note">' + esc(g.note) + "</span>" : "") +
        '<div class="votes">' + dots + "</div>" + chips +
        (sc && sc.awayScore !== "" && sc.homeScore !== ""
          ? '<span class="final num">' + esc(sc.awayScore) + "\u2013" + esc(sc.homeScore) + "</span>" : "") +
      "</div></article>";
  }

  /* ------------------------------------------------ scores */
  function renderScores() {
    var el = document.getElementById("pane-scores");
    var w = state.week, gs = gamesFor(w);
    var h = weekStrip("scores");
    if (!Object.keys(state.weeks).length) {
      el.innerHTML = empty("No lines yet", "Upload a PDF on the Lines tab.");
      return;
    }
    if (!gs.length) {
      el.innerHTML = h + empty("Pick a week", "Choose a week above to grade it.");
      wireWeekStrip(el);
      return;
    }

    var graded = gs.filter(function (g) { return resultOf(w, g); }).length;
    h += '<div class="head"><div><h2>Week ' + w + " Results</h2>" +
      "<p>Click whichever team covered the spread. " + graded + " of " + gs.length +
      " graded.</p></div></div>";

    var day = null;
    gs.forEach(function (g) {
      if (g.day && g.day !== day) { day = g.day; h += '<div class="daymark">' + esc(day) + "</div>"; }
      var r = resultOf(w, g);
      var sc = scoresFor(w)[g.id];
      var line = g.favored
        ? esc(g.favored === "away" ? g.away : g.home) + " \u2212" + fmt(g.spread)
        : "no line";
      h += '<div class="gline"><span class="t">' + esc(g.away) + " at " + esc(g.home) +
        "</span>" + '<span class="muted num" style="font-size:.75rem">' + line + "</span>" +
        (sc && sc.awayScore !== "" && sc.homeScore !== ""
          ? '<span class="r num">' + esc(sc.awayScore) + "\u2013" + esc(sc.homeScore) + "</span>"
          : '<span class="r"></span>') + "</div>";

      function cv(which, name) {
        return '<button class="cv" data-gid="' + esc(g.id) + '" data-res="' + which +
          '" aria-pressed="' + (r === which) + '">' +
          '<span class="nm">' + esc(name) + "</span>" +
          '<span class="sp">' + spreadLabel(g, which) + "</span></button>";
      }
      h += '<div class="cover">' + cv("away", g.away) + cv("home", g.home) +
        '<button class="cv push" data-gid="' + esc(g.id) + '" data-res="push" aria-pressed="' +
        (r === "push") + '">Push</button></div>';
    });

    // Exact scores stay available — they're not needed to grade, but they show
    // up on the picks page and some weeks are worth recording properly.
    var sc2 = scoresFor(w);
    h += '<details style="margin-top:1.6rem"><summary class="muted" style="cursor:pointer">' +
      "Add exact scores (optional)</summary>" +
      '<div class="tablewrap" style="margin-top:.6rem"><table><thead><tr><th>Game</th>' +
      "<th>Away</th><th>Home</th><th>From the scores</th></tr></thead><tbody>";
    gs.forEach(function (g) {
      var s0 = sc2[g.id] || {};
      var fromScore = P.atsWinner(g, s0);
      h += "<tr><td>" + esc(g.away) + " at " + esc(g.home) + "</td>" +
        '<td><input class="num sc" data-gid="' + esc(g.id) + '" data-k="awayScore" ' +
          'inputmode="numeric" style="width:70px" value="' +
          esc(s0.awayScore == null ? "" : s0.awayScore) + '"></td>' +
        '<td><input class="num sc" data-gid="' + esc(g.id) + '" data-k="homeScore" ' +
          'inputmode="numeric" style="width:70px" value="' +
          esc(s0.homeScore == null ? "" : s0.homeScore) + '"></td>' +
        "<td>" + (fromScore === "push" ? '<span class="chip push">Push</span>'
          : fromScore ? '<span class="chip win">' +
              esc(fromScore === "away" ? g.away : g.home) + " covers</span>"
          : '<span class="chip">\u2014</span>') + "</td></tr>";
    });
    h += "</tbody></table></div></details>" + statusLine();
    el.innerHTML = h;
    wireWeekStrip(el);

    Array.prototype.forEach.call(el.querySelectorAll(".cv"), function (b) {
      b.addEventListener("click", function () {
        var gid = b.dataset.gid, val = b.dataset.res;
        var cur = resultsFor(w)[gid];
        (state.results[w] = state.results[w] || {})[gid] = (cur === val ? null : val);
        render();
        saveScore(w);
      });
    });

    Array.prototype.forEach.call(el.querySelectorAll(".sc"), function (i) {
      i.addEventListener("change", function () {
        var gid = i.dataset.gid, k = i.dataset.k;
        var cur = (scoresFor(w)[gid]) || { awayScore: "", homeScore: "" };
        var next = { awayScore: cur.awayScore == null ? "" : cur.awayScore,
                     homeScore: cur.homeScore == null ? "" : cur.homeScore };
        next[k] = i.value.trim() === "" ? "" : Number(i.value);
        (state.scores[w] = state.scores[w] || {})[gid] = next;
        // typing a full score also settles the result, unless one is already set
        var derived = P.atsWinner(gamesFor(w).find(function (g) { return g.id === gid; }), next);
        if (derived && !resultsFor(w)[gid]) {
          (state.results[w] = state.results[w] || {})[gid] = derived;
        }
        render();
        saveScore(w);
      });
    });
  }

  /* ------------------------------------------------ standings */
  function renderStandings() {
    var el = document.getElementById("pane-standings");
    var weeks = Object.keys(state.weeks).map(Number).sort(function (a, b) { return a - b; });
    if (!weeks.length) { el.innerHTML = empty("Nothing to score yet", "Upload a week and make some picks."); return; }

    function seasonRec(sideFor) {
      var t = { w: 0, l: 0, p: 0 };
      weeks.forEach(function (wk) {
        var r = P.tally(gamesFor(wk), function (g) { return sideFor(wk, g); },
          function (g) { return resultOf(wk, g); });
        t.w += r.w; t.l += r.l; t.p += r.p;
      });
      return t;
    }
    var groupSide = function (wk, g) { return P.majority(votesFor(wk, g.id), PEOPLE); };
    var group = seasonRec(groupSide);

    var h = '<div class="head"><div><h2>Standings</h2><p>Against the spread, ' +
      SEASON + " season. Pushes are void.</p></div></div>";
    h += '<div class="cards"><div class="card lead"><h3>The Group</h3>' +
      '<div class="rec">' + recStr(group) + '</div><div class="pct">' + pctStr(group) +
      " &middot; majority pick</div></div>";
    var indiv = PEOPLE.map(function (p) {
      return { p: p, r: seasonRec(function (wk, g) { return pickOf(wk, p, g.id); }) };
    });
    var best = indiv.slice().sort(function (a, b) {
      return (b.r.w - b.r.l) - (a.r.w - a.r.l);
    })[0];
    indiv.forEach(function (x) {
      h += '<div class="card' + (x.r.w + x.r.l && x === best ? " lead" : "") + '"><h3>' + esc(x.p) +
        '</h3><div class="rec">' + recStr(x.r) + '</div><div class="pct">' + pctStr(x.r) + "</div></div>";
    });
    h += "</div>";

    h += '<div class="tablewrap"><table><thead><tr><th>Week</th><th>Group</th>' +
      PEOPLE.map(function (p) { return "<th>" + esc(p) + "</th>"; }).join("") +
      "<th>Graded</th></tr></thead><tbody>";
    weeks.forEach(function (wk) {
      var gs = gamesFor(wk);
      var graded = gs.filter(function (g) { return resultOf(wk, g); }).length;
      var gr = P.tally(gs, function (g) { return groupSide(wk, g); }, function (g) { return resultOf(wk, g); });
      h += "<tr><td>Week " + wk + '</td><td class="n">' + recStr(gr) + "</td>" +
        PEOPLE.map(function (p) {
          var r = P.tally(gs, function (g) { return pickOf(wk, p, g.id); },
            function (g) { return resultOf(wk, g); });
          return '<td class="n">' + recStr(r) + "</td>";
        }).join("") +
        '<td class="n">' + graded + "/" + gs.length + "</td></tr>";
    });
    h += "</tbody></table></div>";
    el.innerHTML = h;
  }

  /* ------------------------------------------------ lines */
  function renderLines() {
    var el = document.getElementById("pane-lines");
    var d = state.draft;
    var h = weekStrip("lines") + '<div class="head"><div><h2>Weekly Lines</h2>' +
      "<p>Upload the commissioner's PDF. Check what it read before saving \u2014 " +
      "the spread's position on the page is what says who's favored.</p></div></div>";

    h += '<div class="drop" id="drop"><button class="btn" id="pick">Choose PDF</button>' +
      "<p>or drop it here</p>" +
      '<input type="file" id="file" accept="application/pdf" hidden></div>';
    h += '<div class="row"><button class="btn ghost" id="blank">Start a blank week</button>' +
      '<span class="muted">No PDF? Enter the games by hand.</span></div>';

    if (d) {
      h += '<div class="row"><label class="who">Week <input class="num" id="dweek" ' +
        'style="width:70px" value="' + esc(d.week == null ? "" : d.week) + '"></label>' +
        '<span class="muted">' + d.games.length + " games</span></div>";
      if (d.warnings && d.warnings.length) {
        h += '<div class="warn"><b>Check these before saving:</b><ul>' +
          d.warnings.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" +
          "<p style=\"margin:.5rem 0 0\">Fill anything missing in by hand below — " +
          "nothing is saved until you hit save.</p></div>";
      }
      if (d.debug) {
        h += '<details style="margin:.6rem 0"><summary class="muted" style="cursor:pointer">' +
          "Show what the PDF actually contained</summary>" +
          '<textarea readonly id="dbg" style="width:100%;height:190px;margin-top:.5rem;' +
          'font-family:var(--mono);font-size:.72rem;background:var(--panel-2);' +
          'color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:.6rem">' +
          esc(d.debug) + "</textarea>" +
          '<p class="muted" style="margin:.4rem 0 0">Each line is x,y then the text. ' +
          "Copy this if a spread is still being missed.</p></details>";
      }
      h += '<div class="edithead"><span>Day</span><span>Away</span><span>Home</span>' +
        "<span>Spread</span><span>Favored</span><span></span></div>";
      d.games.forEach(function (g, i) {
        h += '<div class="edit" data-i="' + i + '">' +
          '<input data-k="day" value="' + esc(g.day) + '" placeholder="Day">' +
          '<input data-k="away" value="' + esc(g.away) + '" placeholder="Away">' +
          '<input data-k="home" value="' + esc(g.home) + '" placeholder="Home">' +
          '<input data-k="spread" class="num" value="' + esc(g.spread == null ? "" : g.spread) + '" placeholder="\u2014">' +
          // Name the teams rather than "Away"/"Home" \u2014 checking a parse against
          // the sheet means reading team names, and the stored value is
          // unchanged either way.
          '<select data-k="favored">' +
            '<option value=""' + (!g.favored ? " selected" : "") + ">\u2014</option>" +
            '<option value="away"' + (g.favored === "away" ? " selected" : "") + ">" +
              esc(g.away || "Away") + "</option>" +
            '<option value="home"' + (g.favored === "home" ? " selected" : "") + ">" +
              esc(g.home || "Home") + "</option>" +
          "</select>" +
          '<button class="x" data-del="' + i + '" title="Remove">&times;</button></div>';
      });
      h += '<div class="row"><button class="btn ghost" id="addrow">+ Add game</button>' +
        '<label class="who">Byes <input id="dbyes" style="width:220px" value="' +
        esc((d.byes || []).join(", ")) + '"></label></div>';
      var clash = d.week != null && state.weeks[d.week];
      if (clash) {
        h += '<div class="warn"><b>Week ' + esc(d.week) + " already has lines saved.</b> " +
          "Saving replaces them. Picks are kept, but any game whose teams changed " +
          "counts as a new game and loses its picks.</div>";
      }
      h += '<div class="row"><button class="btn" id="save">' +
        (clash ? "Replace Week " : "Save Week ") + esc(d.week == null ? "" : d.week) +
        "</button>" +
        '<button class="btn ghost" id="cancel">Discard</button></div>';
    }

    // ---- danger zone: wipe a week so a test run can be cleared out ----
    var wk = state.week;
    if (wk != null && state.weeks[wk]) {
      h += '<h3 style="margin-top:2.2rem;font-size:.78rem;letter-spacing:.14em;' +
        'text-transform:uppercase;color:var(--muted)">Delete a week</h3>';
      if (state.confirmDelete === wk) {
        h += '<div class="warn"><b>Delete week ' + esc(wk) + " for everyone?</b> " +
          "This removes the lines, all three people's picks and the scores. " +
          "It cannot be undone.<div class=\"row\">" +
          '<button class="btn" id="delyes" style="background:var(--loss);color:#fff">' +
          "Yes, delete week " + esc(wk) + "</button>" +
          '<button class="btn ghost" id="delno">Keep it</button></div></div>';
      } else {
        h += '<div class="row"><button class="btn ghost" id="del">Delete week ' +
          esc(wk) + "</button>" +
          '<span class="muted">Clears its lines, picks and scores. Useful after a test run.</span></div>';
      }
    }
    h += statusLine();
    el.innerHTML = h;
    wireWeekStrip(el);

    var file = document.getElementById("file");
    document.getElementById("pick").addEventListener("click", function () { file.click(); });
    file.addEventListener("change", function () { if (file.files[0]) readPdf(file.files[0]); });
    var drop = document.getElementById("drop");
    ["dragenter", "dragover"].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); });
    });
    ["dragleave", "drop"].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); });
    });
    drop.addEventListener("drop", function (e) {
      var f = e.dataTransfer.files[0]; if (f) readPdf(f);
    });
    document.getElementById("blank").addEventListener("click", function () {
      state.draft = { week: latestWeek() ? latestWeek() + 1 : 1, games: [], byes: [], warnings: [] };
      addRow(); render();
    });

    var delBtn = document.getElementById("del");
    if (delBtn) delBtn.addEventListener("click", function () {
      state.confirmDelete = state.week; render();
    });
    var delNo = document.getElementById("delno");
    if (delNo) delNo.addEventListener("click", function () {
      state.confirmDelete = null; render();
    });
    var delYes = document.getElementById("delyes");
    if (delYes) delYes.addEventListener("click", function () {
      deleteWeek(state.week);
    });

    if (!d) return;
    document.getElementById("dweek").addEventListener("change", function (e) {
      state.draft.week = e.target.value ? Number(e.target.value) : null; render();
    });
    document.getElementById("dbyes").addEventListener("change", function (e) {
      state.draft.byes = e.target.value.split(",").map(function (s) { return s.trim(); })
        .filter(Boolean);
    });
    Array.prototype.forEach.call(el.querySelectorAll(".edit [data-k]"), function (inp) {
      inp.addEventListener("change", function () {
        var i = Number(inp.closest(".edit").dataset.i), k = inp.dataset.k;
        var v = inp.value;
        if (k === "spread") v = v.trim() === "" ? null : Number(v);
        state.draft.games[i][k] = v;
        if (k === "away" || k === "home") {
          var g = state.draft.games[i];
          g.id = (g.away + "-" + g.home).toLowerCase().replace(/[^a-z0-9]+/g, "-")
            .replace(/^-|-$/g, "");
          render();   // the favored menu names the teams, so relabel it
        }
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll("[data-del]"), function (b) {
      b.addEventListener("click", function () {
        state.draft.games.splice(Number(b.dataset.del), 1); render();
      });
    });
    document.getElementById("addrow").addEventListener("click", function () { addRow(); render(); });
    document.getElementById("cancel").addEventListener("click", function () {
      state.draft = null; render();
    });
    document.getElementById("save").addEventListener("click", async function () {
      var dd = state.draft;
      if (dd.week == null || !dd.games.length) return note("Need a week number and at least one game.");
      var bad = dd.games.filter(function (g) { return !g.away || !g.home; });
      if (bad.length) return note("Every game needs both teams.");
      await saveWeek(dd.week, dd.games, dd.byes);
      state.week = dd.week; state.draft = null;
      buildChrome(); render();
    });
  }

  function addRow() {
    state.draft.games.push({ id: "g" + Date.now() + Math.random().toString(36).slice(2, 6),
      day: "", away: "", home: "", spread: null, favored: null, note: "" });
  }

  /* ------------------------------------------------ pdf */
  var WORKER_URL =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  var workerReady = null;

  // Chrome refuses to construct a Worker from a different origin, so pointing
  // workerSrc straight at the CDN throws before a single page is read. Fetch the
  // worker source and hand pdf.js a same-origin blob URL instead.
  function preparePdfWorker() {
    if (workerReady) return workerReady;
    workerReady = fetch(WORKER_URL)
      .then(function (r) {
        if (!r.ok) throw new Error("worker fetch " + r.status);
        return r.text();
      })
      .then(function (src) {
        var blob = new Blob([src], { type: "text/javascript" });
        pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
      })
      .catch(function () {
        // Last resort: let pdf.js try the CDN directly. It may still work in
        // browsers that allow it, and if not the error surfaces below.
        pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER_URL;
      });
    return workerReady;
  }

  async function readPdf(f) {
    note("Reading " + f.name + "\u2026");
    try {
      if (!window.pdfjsLib) throw new Error("the PDF library failed to load \u2014 check your connection");
      await preparePdfWorker();
      var buf = await f.arrayBuffer();
      var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      var words = [], pageWidth = 612;
      for (var n = 1; n <= pdf.numPages; n++) {
        var page = await pdf.getPage(n);
        pageWidth = page.view[2] || pageWidth;
        var tc = await page.getTextContent();
        var offset = (n - 1) * 2000;      // stack pages vertically, top page first
        tc.items.forEach(function (it) {
          if (!it.str || !it.str.trim()) return;
          words.push({ str: it.str, x: it.transform[4], y: it.transform[5] - offset,
                       w: it.width || 0 });
        });
      }
      var out = P.parseWords(words, pageWidth);
      // Keep what the PDF actually contained. If a spread still goes missing,
      // this is the only way to see why without having the file to hand.
      out.debug = words.map(function (x) {
        return Math.round(x.x) + "," + Math.round(x.y) + "  " + x.str;
      }).join("\n");
      if (!words.length) {
        state.draft = { week: null, games: [], byes: [], debug: "",
          warnings: ["This PDF has no text in it \u2014 it's probably a scan or an "
                   + "image. There's nothing to read, so enter the games by hand."] };
        addRow();
        note("No text found in that PDF.");
      } else if (!out.games.length) {
        state.draft = { week: null, games: [], byes: out.byes,
                        warnings: out.warnings, debug: out.debug };
        addRow();
        note("Couldn't find any games in that PDF \u2014 enter them by hand below.");
      } else {
        state.draft = out;
        note("Read " + out.games.length + " games. Check the favored column before saving.");
      }
    } catch (e) {
      state.draft = { week: null, games: [], byes: [],
        warnings: ["Couldn't read that PDF: " + (e && e.message ? e.message : e)],
        debug: "" };
      addRow();
      note("Couldn't read that PDF \u2014 enter the games by hand below.");
    }
  }

  /* ------------------------------------------------ bits */
  /** Week buttons — one per saved week. Replaces the old header dropdown so
   *  moving between weeks is a single click from wherever you are. */
  function weekStrip(kind) {
    var keys = Object.keys(state.weeks).map(Number)
      .sort(function (a, b) { return a - b; });
    if (!keys.length) return "";
    return '<div class="weeks">' + keys.map(function (w) {
      var gs = gamesFor(w);
      var sub, done = false;
      if (kind === "scores") {
        var graded = gs.filter(function (g) { return resultOf(w, g); }).length;
        done = gs.length && graded === gs.length;
        sub = done ? "final" : graded + "/" + gs.length;
      } else if (kind === "picks") {
        var mine = state.me
          ? gs.filter(function (g) { return pickOf(w, state.me, g.id); }).length : 0;
        done = gs.length && mine === gs.length;
        sub = state.me ? (done ? "all in" : mine + "/" + gs.length) : gs.length + " games";
      } else {
        sub = gs.length + " games";
      }
      return '<button class="wk' + (done ? " done" : "") + '" data-week="' + w +
        '" aria-pressed="' + (state.week === w) + '">Week ' + w +
        "<small>" + esc(sub) + "</small></button>";
    }).join("") + "</div>";
  }

  function wireWeekStrip(el) {
    Array.prototype.forEach.call(el.querySelectorAll(".wk"), function (b) {
      b.addEventListener("click", function () {
        state.week = Number(b.dataset.week);
        state.confirmDelete = null;
        render();
      });
    });
  }

  function empty(title, sub) {
    return '<div class="empty"><h3>' + esc(title) + "</h3><p>" + esc(sub) + "</p></div>";
  }
  function statusLine() {
    return state.status ? '<p class="status">' + esc(state.status) + "</p>" : '<p class="status"></p>';
  }
})();
</script>

</body>
</html>
